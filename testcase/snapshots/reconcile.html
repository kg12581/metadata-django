<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>对账中心 - 元数据管理平台</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: #0f172a;
      color: #fff;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 54px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
    }
    .brand {
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      white-space: nowrap;
      padding-right: 14px;
      border-right: 1px solid rgba(255, 255, 255, .18);
    }
    .nav-scroll {
      display: flex;
      align-items: stretch;
      overflow: visible;
      scrollbar-width: none;
      flex: 1;
    }
    .nav-group { position: relative; }
    .nav-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 14px;
      padding: 0 12px;
      height: 54px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      font-family: inherit;
    }
    .nav-toggle:hover,
    .nav-group.open .nav-toggle,
    .nav-group.current .nav-toggle { color: #fff; }
    .nav-group.current .nav-toggle { box-shadow: inset 0 -3px 0 #3b82f6; }
    .nav-group:hover .dropdown,
    .nav-group.open .dropdown { display: block; }
    .nav-group:hover .caret,
    .nav-group.open .caret { transform: rotate(180deg); }
    .caret { font-size: 10px; opacity: .8; }
    .nav-icon { margin-right: 5px; font-size: 15px; line-height: 1; }
    .dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 8px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .18);
      min-width: 190px;
      padding: 6px;
      z-index: 120;
    }
    .nav-group.open .dropdown { display: block; }
    .dropdown a {
      display: block;
      color: #334155;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 14px;
      white-space: nowrap;
    }
    .dropdown a:hover { background: #f1f5f9; color: var(--primary); }
    .dropdown .sep {
      height: 1px;
      background: var(--border);
      margin: 5px 8px;
    }
    @media (max-width: 720px) {
      .brand { font-size: 14px; padding-right: 8px; }
      .nav-toggle { padding: 0 8px; font-size: 13px; }
      .nav-scroll { overflow-x: auto; }
      .nav-group.open .dropdown {
        position: static;
        min-width: 0;
        box-shadow: none;
        border-radius: 0;
        background: #f8fafc;
      }
    }
    .header-right { margin-left: auto; }
    .header-right .nav-toggle { color: #94a3b8; }
    .header-right .nav-toggle:hover { color: #fff; }
    .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
      padding: 20px;
      margin-bottom: 20px;
    }
    h2, h3 { margin-top: 0; }
    .muted { color: var(--muted); font-size: 13px; }
    .danger { color: #b91c1c; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th { background: #f8fafc; white-space: nowrap; }
    tr:hover td { background: #f8fafc; }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }
    .badge.synced  { background: #dcfce7; color: #166534; }
    .badge.error   { background: #fee2e2; color: #991b1b; }
    .badge.pending { background: #fef9c3; color: #854d0e; }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }
    .btn:disabled { opacity: .6; cursor: wait; }
    .btn.ghost { background: #e2e8f0; color: #0f172a; }
    input[type=search] {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      width: 280px;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .grid .card { margin-bottom: 0; display: flex; flex-direction: column; }
    .grid .card .grow { flex: 1; }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">元数据管理平台</a>
    <nav class="nav-scroll" id="mainNav">
      <div class="nav-group" data-match="/">
        <a class="nav-toggle" href="/"><span class="nav-icon">🏠</span>数据总览</a>
      </div>
      <div class="nav-group" data-match="/sources/,/sql-helper/,/databases/,/tables/">
        <button class="nav-toggle" type="button" onclick="toggleGroup(this)"><span class="nav-icon">🗄️</span>元数据 <span class="caret">▾</span></button>
        <div class="dropdown">
          <a href="/">数据源总览</a>
          <a href="/sources/">数据源配置(JDBC)</a>
          <a href="/sql-helper/">SQL 助手</a>
        </div>
      </div>
      <div class="nav-group" data-match="/ai-sql/,/spark2sql/,/oracle2hive/">
        <button class="nav-toggle" type="button" onclick="toggleGroup(this)"><span class="nav-icon">🤖</span>AI 助手 <span class="caret">▾</span></button>
        <div class="dropdown">
          <a href="/ai-sql/">AI 写 SQL</a>
          <a href="/spark2sql/">Spark 转 Hive</a>
          <a href="/oracle2hive/">Oracle 转 Hive</a>
        </div>
      </div>
      <div class="nav-group" data-match="/scheduler/,/schema-sync/,/datax/,/etl/,/flink-sql/">
        <button class="nav-toggle" type="button" onclick="toggleGroup(this)"><span class="nav-icon">🔄</span>数据同步 <span class="caret">▾</span></button>
        <div class="dropdown">
          <a href="/scheduler/">调度中心</a>
          <a href="/schema-sync/">结构同步任务</a>
          <a href="/datax/">DataX 同步</a>
          <a href="/etl/">ETL 管理</a>
          <a href="/flink-sql/">Flink SQL</a>
        </div>
      </div>
      <div class="nav-group" data-match="/reconcile/,/sql-files/,/lineage/">
        <button class="nav-toggle" type="button" onclick="toggleGroup(this)"><span class="nav-icon">🧪</span>质量治理 <span class="caret">▾</span></button>
        <div class="dropdown">
          <a href="/reconcile/">对账中心</a>
          <a href="/sql-files/">SQL 文件库</a>
          <a href="/lineage/">SQL 血缘</a>
        </div>
      </div>
      <div class="nav-group" data-match="/ops/,/scripts/">
        <button class="nav-toggle" type="button" onclick="toggleGroup(this)"><span class="nav-icon">📊</span>平台运营 <span class="caret">▾</span></button>
        <div class="dropdown">
          <a href="/ops/">运营看板</a>
          <a href="/scripts/">脚本管理</a>
          <a href="/docs/">在线文档</a>
          <a href="/docs/?file=04-api-reference.md">API 文档</a>
        </div>
      </div>
      <div class="nav-group header-right" data-match="/docs/">
        <a class="nav-toggle" href="/docs/"><span class="nav-icon">📄</span>文档</a>
      </div>
    </nav>
  </header>
  <div class="container">
    
<div class="card">
  <div class="toolbar" style="margin-bottom:0">
    <div>
      <h2 style="margin:0 0 4px">数据对账中心</h2>
      <div class="muted">行数 / 主键快照 / 字段值 / 业务指标 / 元数据 五种对账(源端 vs Doris)</div>
    </div>
    <button class="btn" onclick="openForm(null)">新建对账任务</button>
  </div>
</div>

<div class="card" id="formCard" style="display:none">
  <h3 id="formTitle">新建对账任务</h3>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;max-width:1100px">
    <div><label class="muted">任务名 *</label><input id="fName" style="w:100%;width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px"></div>
    <div><label class="muted">类型 *</label>
      <select id="fType" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px">
        <option value="row_count">行数对账</option><option value="pk_snapshot">主键快照对账</option><option value="field_value">字段值对账</option><option value="metric">业务指标对账</option><option value="metadata">元数据对账</option>
      </select>
    </div>
    <div><label class="muted">源配置</label><select id="fSource" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px"></select></div>
    <div><label class="muted">源库名</label><input id="fSourceDb" placeholder="ai_chatbot" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px"></div>
    <div><label class="muted">Doris 目标库</label><input id="fTargetDb" placeholder="test_db" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px"></div>
  </div>
  <div style="margin-top:12px"><label class="muted">表名(每行一个)</label><textarea id="fTables" rows="3" style="width:100%;max-width:1100px;padding:8px;border:1px solid #cbd5e1;border-radius:8px;font-family:monospace"></textarea></div>
  <div id="fExtra"></div>
  <div style="margin-top:12px;display:flex;gap:8px">
    <button class="btn" onclick="saveForm()">保存</button>
    <button class="btn ghost" onclick="document.getElementById('formCard').style.display='none'">取消</button>
  </div>
</div>

<div class="card"><div id="taskList"></div></div>
<div class="card"><h3>执行结果</h3><pre id="resultArea" style="background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:12px;overflow:auto;max-height:420px;font-size:12px;margin:0">暂无。</pre></div>

  </div>
  
<script>
const TYPE_EXTRA = {
  pk_snapshot: {label: '主键列(逗号分隔)', key: 'pk'},
  field_value: {label: '对账字段(逗号分隔, 空=全部自动), 格式: col 或 col:sum', key: 'cols'}
};
let editId = null;
let sources = [];
function showResult(t){document.getElementById('resultArea').textContent=typeof t==='string'?t:JSON.stringify(t,null,2);}

async function loadSources(){
  const resp = await fetch('/api/metadata/sources/');
  const data = await resp.json();
  sources = data.data || [];
  const sel = document.getElementById('fSource');
  sel.innerHTML = '<option value="">(不指定, 用 .env 连接)</option>';
  sources.forEach(s => { const o=document.createElement('option'); o.value=s.id; o.textContent='['+s.db_type+'] '+s.name+' / '+s.database_name; sel.appendChild(o); });
}

function openForm(task){
  editId = task ? task.id : null;
  document.getElementById('formTitle').textContent = task ? '编辑: '+task.name : '新建对账任务';
  document.getElementById('fName').value = task ? task.name : '';
  document.getElementById('fType').value = task ? task.task_type : 'row_count';
  document.getElementById('fSource').value = task ? (task.source_config_id || '') : '';
  document.getElementById('fSourceDb').value = task ? (task.source_db_name||'') : '';
  document.getElementById('fTargetDb').value = task ? (task.target_db_name||'test_db') : 'test_db';
  document.getElementById('fTables').value = (task ? (task.tables||[]) : []).join('\n');
  renderExtra(task);
  document.getElementById('formCard').style.display='block';
}

function renderExtra(task){
  const box = document.getElementById('fExtra');
  const type = document.getElementById('fType').value;
  box.innerHTML='';
  if (type==='pk_snapshot'){
    box.innerHTML='<label class="muted">主键列(逗号分隔)</label><input id="fPk" value="'+(task? (task.pk_columns||[]).join(',') : 'id')+'" style="width:100%;max-width:600px;padding:8px;border:1px solid #cbd5e1;border-radius:8px">';
  } else if (type==='field_value'){
    box.innerHTML='<label class="muted">对账字段(逗号分隔, 空=所有字段的 COUNT/DISTINCT/MIN/MAX)</label><input id="fCols" value="'+(task? (task.columns||[]).join(',') : '')+'" style="width:100%;max-width:900px;padding:8px;border:1px solid #cbd5e1;border-radius:8px">';
  } else if (type==='metric'){
    box.innerHTML='<label class="muted">指标 SQL(用 {table} 占位表名)</label><textarea id="fMetric" rows="2" style="width:100%;max-width:1100px;padding:8px;border:1px solid #cbd5e1;border-radius:8px;font-family:monospace">'+(task? (task.metric_sql||'SELECT COUNT(*) AS cnt, SUM(`amount`) AS total FROM `{table}`') : 'SELECT COUNT(*) AS cnt, SUM(`amount`) AS total FROM `{table}`')+'</textarea>';
  }
}
document.getElementById('fType').addEventListener('change', ()=>renderExtra(null));

async function saveForm(){
  const type = document.getElementById('fType').value;
  const payload = {
    name: document.getElementById('fName').value.trim(),
    task_type: type,
    source_config_id: document.getElementById('fSource').value || null,
    source_db_name: document.getElementById('fSourceDb').value.trim(),
    target_db_name: document.getElementById('fTargetDb').value.trim(),
    tables: document.getElementById('fTables').value.split('\n').map(s=>s.trim()).filter(Boolean)
  };
  if (type==='pk_snapshot') payload.pk_columns = (document.getElementById('fPk').value||'').split(',').map(s=>s.trim()).filter(Boolean);
  if (type==='field_value') payload.columns = (document.getElementById('fCols').value||'').split(',').map(s=>s.trim()).filter(Boolean);
  if (type==='metric') payload.metric_sql = document.getElementById('fMetric').value;
  const url = editId ? '/api/metadata/reconcile/tasks/'+editId+'/update/' : '/api/metadata/reconcile/tasks/create/';
  const resp = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  const data = await resp.json();
  showResult(data);
  if (data.code===0){ document.getElementById('formCard').style.display='none'; loadTasks(); }
}

async function loadTasks(){
  const resp = await fetch('/api/metadata/reconcile/tasks/');
  const data = await resp.json();
  const list = document.getElementById('taskList');
  list.innerHTML='';
  const tasks = data.data||[];
  if(!tasks.length){ list.textContent='暂无对账任务。'; return; }
  const table=document.createElement('table');
  table.innerHTML='<thead><tr><th>任务</th><th>类型</th><th>源库</th><th>表数</th><th>最近执行</th><th>操作</th></tr></thead>';
  const tbody=document.createElement('tbody');
  tasks.forEach(t=>{
    const tr=document.createElement('tr');
    const last=t.last_run? (t.last_run.status+' '+(t.last_run.summary? (t.last_run.summary.ok+'/'+t.last_run.summary.total):'')) : '-';
    tr.innerHTML='<td><strong>'+t.name+'</strong></td><td>'+t.task_type_label+'</td><td>'+t.source_db_name+'</td><td>'+t.tables.length+'</td><td>'+last+'</td>'+
      '<td style="white-space:nowrap"><a href="#" onclick="runTask('+t.id+');return false">执行</a> | <a href="#" onclick="editTask('+t.id+');return false">编辑</a> | <a href="#" style="color:#b91c1c" onclick="delTask('+t.id+');return false">删除</a></td>';
    tbody.appendChild(tr);
  });
  table.appendChild(tbody); list.appendChild(table);
}

async function loadTaskDetail(id){
  const resp = await fetch('/api/metadata/reconcile/tasks/'+id+'/');
  const data = await resp.json();
  return data.data;
}
async function editTask(id){
  const detail = await loadTaskDetail(id);
  openForm(detail.task);
}
async function runTask(id){
  if(!confirm('确定执行该对账任务？')) return;
  showResult({message:'执行中...'});
  const resp = await fetch('/api/metadata/reconcile/tasks/'+id+'/run/', {method:'POST'});
  showResult(await resp.json());
  loadTasks();
}
async function delTask(id){
  if(!confirm('确定删除？')) return;
  const resp = await fetch('/api/metadata/reconcile/tasks/'+id+'/delete/', {method:'POST'});
  showResult(await resp.json()); loadTasks();
}

loadSources(); loadTasks();
</script>

  <script>
  function toggleGroup(btn) {
    var group = btn.parentElement;
    var wasOpen = group.classList.contains('open');
    document.querySelectorAll('#mainNav .nav-group.open').forEach(function (g) {
      g.classList.remove('open');
    });
    if (!wasOpen) group.classList.add('open');
  }
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#mainNav .nav-group')) {
      document.querySelectorAll('#mainNav .nav-group.open').forEach(function (g) {
        g.classList.remove('open');
      });
    }
  });
  // 当前页面对应分组高亮
  (function () {
    var path = location.pathname;
    document.querySelectorAll('#mainNav .nav-group').forEach(function (g) {
      var matches = (g.getAttribute('data-match') || '').split(',');
      if (matches.some(function (m) {
        return m && (m === '/' ? path === '/' : path.indexOf(m) === 0);
      })) {
        g.classList.add('current');
      }
    });
  })();
  </script>
</body>
</html>
