<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据字典 - 元数据管理平台</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: #0f172a;
      color: #fff;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 54px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
    }
    .brand {
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      white-space: nowrap;
      padding-right: 14px;
      border-right: 1px solid rgba(255, 255, 255, .18);
    }
    .nav-scroll {
      display: flex;
      align-items: stretch;
      overflow: visible;
      scrollbar-width: none;
      flex: 1;
    }
    .nav-group { position: relative; }
    .nav-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 14px;
      padding: 0 12px;
      height: 54px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      font-family: inherit;
    }
    .nav-toggle:hover,
    .nav-group.open .nav-toggle,
    .nav-group.current .nav-toggle { color: #fff; }
    .nav-group.current .nav-toggle { box-shadow: inset 0 -3px 0 #3b82f6; }
    .nav-group:hover .dropdown,
    .nav-group.open .dropdown { display: block; }
    .nav-group:hover .caret,
    .nav-group.open .caret { transform: rotate(180deg); }
    .caret { font-size: 10px; opacity: .8; }
    .nav-icon { margin-right: 5px; font-size: 15px; line-height: 1; }
    .dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 8px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .18);
      min-width: 190px;
      padding: 6px;
      z-index: 120;
    }
    .nav-group.open .dropdown { display: block; }
    .dropdown a {
      display: block;
      color: #334155;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 14px;
      white-space: nowrap;
    }
    .dropdown a:hover { background: #f1f5f9; color: var(--primary); }
    .dropdown .sep {
      height: 1px;
      background: var(--border);
      margin: 5px 8px;
    }
    @media (max-width: 720px) {
      .brand { font-size: 14px; padding-right: 8px; }
      .nav-toggle { padding: 0 8px; font-size: 13px; }
      .nav-scroll { overflow-x: auto; }
      .nav-group.open .dropdown {
        position: static;
        min-width: 0;
        box-shadow: none;
        border-radius: 0;
        background: #f8fafc;
      }
    }
    .header-right { margin-left: auto; }
    .header-right .nav-toggle { color: #94a3b8; }
    .header-right .nav-toggle:hover { color: #fff; }
    .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
      padding: 20px;
      margin-bottom: 20px;
    }
    h2, h3 { margin-top: 0; }
    .muted { color: var(--muted); font-size: 13px; }
    .danger { color: #b91c1c; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th { background: #f8fafc; white-space: nowrap; }
    tr:hover td { background: #f8fafc; }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }
    .badge.synced  { background: #dcfce7; color: #166534; }
    .badge.error   { background: #fee2e2; color: #991b1b; }
    .badge.pending { background: #fef9c3; color: #854d0e; }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }
    .btn:disabled { opacity: .6; cursor: wait; }
    .btn.ghost { background: #e2e8f0; color: #0f172a; }
    input[type=search] {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      width: 280px;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .grid .card { margin-bottom: 0; display: flex; flex-direction: column; }
    .grid .card .grow { flex: 1; }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>

    <a class="brand" href="/">元数据管理平台</a>
    <nav class="nav-scroll" id="mainNav">
      <div class="nav-group" data-match="/">
        <a class="nav-toggle" href="/"><span class="nav-icon">🏠</span>数据总览</a>
      </div>

        <button class="nav-toggle" type="button" onclick="toggleGroup(this)"><span class="nav-icon">🤖</span>AI 助手 <span class="caret">▾</span></button>
        <div class="dropdown">

        <button class="nav-toggle" type="button" onclick="toggleGroup(this)"><span class="nav-icon">🔄</span>数据同步 <span class="caret">▾</span></button>
        <div class="dropdown">
          <a href="/scheduler/">调度中心</a>
          <a href="/schema-sync/">结构同步任务</a>
          <a href="/datax/">DataX 同步</a>

      </div>
      <div class="nav-group" data-match="/reconcile/,/sql-files/,/lineage/">

        <div class="dropdown">
          <a href="/reconcile/">对账中心</a>

      </div>
      <div class="nav-group" data-match="/ops/,/scripts/">
        <button class="nav-toggle" type="button" onclick="toggleGroup(this)"><span class="nav-icon">📊</span>平台运营 <span class="caret">▾</span></button>
        <div class="dropdown">
          <a href="/ops/">运营看板</a>
          <a href="/scripts/">脚本管理</a>
          <a href="/docs/">在线文档</a>
          <a href="/docs/?file=04-api-reference.md">API 文档</a>
        </div>
      </div>
      <div class="nav-group header-right" data-match="/docs/">
        <a class="nav-toggle" href="/docs/"><span class="nav-icon">📄</span>文档</a>
      </div>
    </nav>
  </header>
  <div class="container">
    
<div class="card">
  <h2 style="margin:0 0 4px">数据字典</h2>
  <div class="muted">基于已同步元数据的字段级字典; 支持按库/关键字过滤, 可导出 Excel</div>
</div>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px" id="summaryCards"></div>

<div class="card">
  <div class="toolbar" style="margin-bottom:0">
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <select id="dbSelect" onchange="search()" style="padding:8px;border:1px solid #cbd5e1;border-radius:8px">
        <option value="">全部数据源</option>
      </select>
      <input id="qInput" placeholder="搜索 表名/字段/注释..." style="width:260px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px">
      <button class="btn" onclick="search()">查询</button>
      <span class="muted" id="resultInfo"></span>
    </div>
    <a class="btn ghost" id="exportLink" href="/api/metadata/dictionary/export/">导出 Excel</a>
  </div>
  <div style="overflow:auto">
    <table>
      <thead>
        <tr>
          <th>库</th><th>Schema</th><th>表名</th><th>表注释</th>
          <th>#</th><th>字段名</th><th>类型</th><th>可空</th><th>默认值</th><th>字段注释</th><th></th>
        </tr>
      </thead>
      <tbody id="dictBody"></tbody>
    </table>
  </div>
  <div style="margin-top:10px;display:flex;gap:8px">
    <button class="btn ghost" id="prevBtn" onclick="page(-1)">上一页</button>
    <button class="btn ghost" id="nextBtn" onclick="page(1)">下一页</button>
  </div>
</div>

  </div>
  
<script>
const LIMIT = 300;
let total = 0;
let offset = 0;
let currentQ = '';
let currentDb = '';

function showInfo() {
  document.getElementById('resultInfo').textContent =
    '共 ' + total + ' 条, 显示 ' + offset + '-' + Math.min(offset + LIMIT, total);
  document.getElementById('prevBtn').disabled = offset <= 0;
  document.getElementById('nextBtn').disabled = offset + LIMIT >= total;
}

async function loadSummary() {
  const resp = await fetch('/api/metadata/dictionary/summary/');
  const data = (await resp.json()).data;
  const cards = document.getElementById('summaryCards');
  const mk = (label, value) => {
    const d = document.createElement('div');
    d.className = 'card';
    d.style.cssText = 'margin:0;text-align:center';
    d.innerHTML = '<div class="muted">' + label + '</div><div style="font-size:26px;font-weight:700">' + value + '</div>';
    cards.appendChild(d);
  };
  mk('数据源', data.database_count);
  mk('表', data.table_count);
  mk('字段', data.column_count);
  const sel = document.getElementById('dbSelect');
  sel.innerHTML = '<option value="">全部数据源</option>';
  (data.databases || []).forEach(db => {
    const o = document.createElement('option');
    o.value = db.id;
    o.textContent = '[' + db.db_type + '] ' + db.database_name + ' (' + db.table_count + ' 表)';
    sel.appendChild(o);
  });
}

async function search() {
  offset = 0;
  currentQ = document.getElementById('qInput').value.trim();
  currentDb = document.getElementById('dbSelect').value;
  await fetchRows();
  updateExportLink();
}

async function page(delta) {
  offset += delta * LIMIT;
  if (offset < 0) offset = 0;
  await fetchRows();
}

async function fetchRows() {
  const url = '/api/metadata/dictionary/search/?limit=' + LIMIT + '&offset=' + offset +
    '&q=' + encodeURIComponent(currentQ) + '&database_id=' + encodeURIComponent(currentDb);
  const resp = await fetch(url);
  const data = (await resp.json()).data;
  total = data.total;
  const tbody = document.getElementById('dictBody');
  tbody.innerHTML = '';
  (data.items || []).forEach(row => {
    const tr = document.createElement('tr');
    const col = row.column;
    tr.innerHTML =
      '<td>' + row.database_name + '</td>' +
      '<td class="mono">' + row.schema_name + '</td>' +
      '<td class="mono">' + row.table_name + '</td>' +
      '<td class="muted">' + (row.table_comment || '-') + '</td>' +
      '<td>' + col.ordinal_position + '</td>' +
      '<td class="mono"><strong>' + col.name + '</strong></td>' +
      '<td class="mono">' + (col.column_type || col.data_type) + '</td>' +
      '<td>' + (col.is_nullable ? '是' : '否') + '</td>' +
      '<td class="mono">' + (col.column_default || '-') + '</td>' +
      '<td class="muted">' + (col.comment || '-') + '</td>' +
      '<td><a href="/tables/' + row.table_id + '/">详情</a></td>';
    tbody.appendChild(tr);
  });
  showInfo();
}

function updateExportLink() {
  const url = '/api/metadata/dictionary/export/?q=' + encodeURIComponent(currentQ) +
    '&database_id=' + encodeURIComponent(currentDb);
  document.getElementById('exportLink').href = url;
}

document.getElementById('qInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') search();
});

loadSummary().then(search);
</script>

  <script>
  function toggleGroup(btn) {
    var group = btn.parentElement;
    var wasOpen = group.classList.contains('open');
    document.querySelectorAll('#mainNav .nav-group.open').forEach(function (g) {
      g.classList.remove('open');
    });
    if (!wasOpen) group.classList.add('open');
  }
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#mainNav .nav-group')) {
      document.querySelectorAll('#mainNav .nav-group.open').forEach(function (g) {
        g.classList.remove('open');
      });
    }
  });
  // 当前页面对应分组高亮
  (function () {
    var path = location.pathname;
    document.querySelectorAll('#mainNav .nav-group').forEach(function (g) {
      var matches = (g.getAttribute('data-match') || '').split(',');
      if (matches.some(function (m) {
        return m && (m === '/' ? path === '/' : path.indexOf(m) === 0);
      })) {
        g.classList.add('current');
      }
    });
  })();
  </script>
</body>
