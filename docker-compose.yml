services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: metadata
      POSTGRES_USER: metadata
      POSTGRES_PASSWORD: change-me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metadata"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-please-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_DB_ENGINE: postgres
      DJANGO_DB_NAME: metadata
      DJANGO_DB_USER: metadata
      DJANGO_DB_PASSWORD: change-me
      DJANGO_DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
