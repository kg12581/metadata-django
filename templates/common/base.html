<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}元数据管理平台{% endblock %}</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: #0f172a;
      color: #fff;
      padding: 12px 24px;
      display: flex;
      gap: 24px;
      align-items: center;
    }
    header a { color: #fff; text-decoration: none; opacity: .85; }
    header a:hover { opacity: 1; }
    .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
      padding: 20px;
      margin-bottom: 20px;
    }
    h2, h3 { margin-top: 0; }
    .muted { color: var(--muted); font-size: 13px; }
    .danger { color: #b91c1c; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th { background: #f8fafc; white-space: nowrap; }
    tr:hover td { background: #f8fafc; }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }
    .badge.synced  { background: #dcfce7; color: #166534; }
    .badge.error   { background: #fee2e2; color: #991b1b; }
    .badge.pending { background: #fef9c3; color: #854d0e; }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }
    .btn:disabled { opacity: .6; cursor: wait; }
    .btn.ghost { background: #e2e8f0; color: #0f172a; }
    input[type=search] {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      width: 280px;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .grid .card { margin-bottom: 0; display: flex; flex-direction: column; }
    .grid .card .grow { flex: 1; }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <header>
    <a href="/"><strong>元数据管理平台</strong></a>
    <a href="/schema-sync/">结构同步任务</a>
    <a href="/datax/">DataX 同步</a>
    <a href="/etl/">ETL 管理</a>
    <a href="/flink-sql/">Flink SQL</a>
    <a href="/sources/">数据源配置</a>
    <a href="/sql-helper/">SQL 助手</a>
    <a href="/api/metadata/">REST API</a>
  </header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  {% block extra_js %}{% endblock %}
</body>
</html>
